name: Verify TraceLens
on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    name: Engine / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: tracelens compare examples/left.snapshot.json examples/right.snapshot.json --log examples/ci.redacted.log --out report.json
      - run: tracelens bundle examples/left.snapshot.json examples/right.snapshot.json --log examples/ci.redacted.log --out evidence.zip
  workbench:
    name: API and browser workflow
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_URLS: http://127.0.0.1:9281
      DataPath: .runtime/ci
      PythonPath: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: dotnet build api -c Release
      - run: |
          mkdir -p .runtime
          dotnet api/bin/Release/net10.0/TraceLens.Api.dll > .runtime/api.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:9281/health; then exit 0; fi
            sleep 1
          done
          cat .runtime/api.log
          exit 1
      - run: npm run test:api
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            test-results/
            playwright-report/
            .runtime/api.log
          retention-days: 14
